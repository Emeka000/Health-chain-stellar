name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'packages/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'packages/**'
      - '.github/workflows/backend-ci.yml'

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tsc, lint, jest)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (workspaces)
        run: npm ci

      - name: Build SDK packages
        run: npm run build:packages

      - name: Type check backend
        run: npx tsc -p backend/tsconfig.build.json --noEmit

      - name: Lint backend
        run: npm run lint --workspace backend

      - name: Test backend
        run: npm test --workspace backend -- --ci
